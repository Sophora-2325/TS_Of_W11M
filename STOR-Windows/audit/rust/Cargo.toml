[package]
name="stor-audit"
version="0.0.0"
edition="2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
dirs = "6"
anyhow = "1"
thiserror = "2"
lru = "0.12"
image = "0.25"
xcap = "0.0.14"
futures-util = "0.3"
base64 = "0.22"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
