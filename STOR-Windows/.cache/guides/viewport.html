<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>viewport</title></head>
<body><script>document.addEventListener('DOMContentLoaded',function(){document.title=window.innerWidth+'x'+window.innerHeight;var p=document.createElement('p');p.id='vp';p.textContent='innerWidth='+window.innerWidth+' innerHeight='+window.innerHeight+' dpr='+window.devicePixelRatio+' scrollW='+document.documentElement.scrollWidth;document.body.appendChild(p);});</script></body></html>
